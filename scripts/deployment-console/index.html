<!doctype html><html lang="ru"><meta charset="utf-8"><title>QIANQI — подготовка развёртывания</title>

<h1>QIANQI · Развёртывание</h1><p>Сначала шесть контрактов проекта. Запуск токена и привязка правил — следующий этап, после проверки фактических адресов и блоков.</p>
<select id="wallet" aria-label="Кошелёк"></select><button id="connect">Подключить кошелёк</button><button id="review">Проверить следующий шаг</button><button id="sign" disabled>Подписать в кошельке</button><button id="refresh">Проверить подтверждение</button>
