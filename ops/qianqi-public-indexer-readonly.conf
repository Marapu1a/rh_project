# Install as qianqi-public-indexer.service.d/10-readonly.conf.
# Index catch-up is independent of financial activation and Telegram money alerts.
[Unit]
ConditionPathExists=
ConditionPathExists=/etc/qianqi/public/indexer.json
ConditionPathExists=/etc/qianqi/public/indexer-approved

[Service]
Environment=RH_INDEXER_BATCH_SIZE=1000
Environment=RH_INDEXER_PASS_TIMEOUT_MS=300000
