server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /opt/rh-preview/releases/9ad5660; }
    location / { return 302 https://qianqi.109.73.196.111.sslip.io$request_uri; }
}
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/qianqi.109.73.196.111.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qianqi.109.73.196.111.sslip.io/privkey.pem;
    server_name qianqi.109.73.196.111.sslip.io;
    root /opt/rh-preview/releases/9ad5660;
    index index.html;
    server_tokens off;
    sendfile off;
    output_buffers 1 512;
    postpone_output 0;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location / { limit_except GET { deny all; } try_files $uri $uri/ =404; }
    location /v1/ { default_type application/json; return 503 '{"error":"unavailable"}'; }
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
}
